_target_: pipeline.hill_climb.HillClimb

# global
rl_epoch: ${rl_epoch}
device: ${device}
logger: ${logger}

# saving
save_dir: ${save_dir}
save_freq: ${save_freq}  # for agent model

# sampling
sample_cfg: ${sample_cfg}

topk_ratio: 0.3

# experience replay
replay: False
replay_args:
  buffer_size: 100
  sample_size: 10
  reward_cutoff: 0.15

# finetune
finetune_cfg: ${finetune_cfg}
