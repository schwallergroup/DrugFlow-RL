_target_: pipeline.try.Try

# global
rl_epoch: ${rl_epoch}
device: ${device}

# saving
save_dir: ./
save_freq: 100  # for agent model

# sampling
sample_cfg: ${sample_cfg}

topk_ratio: 0.3

# experience replay
replay: True
replay_args:
  buffer_size: 100
  sample_size: 10
  reward_cutoff: 0.15

# finetune
finetune_cfg:
  batch_size: ${eval_size}
  epochs: 3
