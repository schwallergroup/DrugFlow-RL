# NFT Pipeline - Bucketed Timestep Sampling
# Fast training with sampled timesteps from buckets

_target_: pipeline.diffusion_nft.DiffusionNFT

# global
rl_epoch: ${rl_epoch}
device: ${device}
logger: ${logger}

# saving
save_dir: ${save_dir}
save_freq: ${save_freq}  # for agent model

# sampling
sample_cfg: ${sample_cfg}

# finetuning
finetune_cfg: ${finetune_cfg}

# NFT configuration
nft_cfg: ${nft_cfg}

# experience replay
replay: false
replay_args:
  buffer_size: 100
  sample_size: 10
  reward_cutoff: 0.15
